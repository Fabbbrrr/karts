[versions]
agp                 = "8.5.2"
kotlin              = "2.0.0"
composeBom          = "2024.09.03"
wearCompose         = "1.3.1"
wearComposeNav      = "1.3.0"
horologist          = "0.6.17"
hilt                = "2.51.1"
hiltNavCompose      = "1.2.0"
datastore           = "1.1.1"
lifecycle           = "2.8.6"
coroutines          = "1.8.1"
socketio            = "2.1.0"
activity            = "1.9.2"

[libraries]
# Compose BOM
compose-bom                     = { group = "androidx.compose",              name = "compose-bom",               version.ref = "composeBom" }
compose-ui                      = { group = "androidx.compose.ui",           name = "ui" }
compose-runtime                 = { group = "androidx.compose.runtime",      name = "runtime" }

# Wear OS Compose
wear-compose-material           = { group = "androidx.wear.compose",         name = "compose-material",          version.ref = "wearCompose" }
wear-compose-foundation         = { group = "androidx.wear.compose",         name = "compose-foundation",        version.ref = "wearCompose" }
wear-compose-navigation         = { group = "androidx.wear.compose",         name = "compose-navigation",        version.ref = "wearComposeNav" }
wear-compose-ui-tooling         = { group = "androidx.wear.compose",         name = "compose-ui-tooling",        version.ref = "wearCompose" }

# Horologist (Google's Wear OS UI patterns)
horologist-composables          = { group = "com.google.android.horologist",  name = "horologist-composables",   version.ref = "horologist" }
horologist-compose-layout       = { group = "com.google.android.horologist",  name = "horologist-compose-layout", version.ref = "horologist" }

# Hilt
hilt-android                    = { group = "com.google.dagger",             name = "hilt-android",              version.ref = "hilt" }
hilt-compiler                   = { group = "com.google.dagger",             name = "hilt-android-compiler",     version.ref = "hilt" }
hilt-navigation-compose         = { group = "androidx.hilt",                 name = "hilt-navigation-compose",   version.ref = "hiltNavCompose" }

# DataStore
datastore-preferences           = { group = "androidx.datastore",            name = "datastore-preferences",     version.ref = "datastore" }

# Lifecycle
lifecycle-viewmodel-compose     = { group = "androidx.lifecycle",            name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose       = { group = "androidx.lifecycle",            name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# Coroutines
kotlinx-coroutines-android      = { group = "org.jetbrains.kotlinx",        name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Socket.IO
socketio-client                 = { group = "io.socket",                     name = "socket.io-client",          version.ref = "socketio" }

# Activity
activity-compose                = { group = "androidx.activity",             name = "activity-compose",          version.ref = "activity" }

[plugins]
android-application             = { id = "com.android.application",          version.ref = "agp" }
kotlin-android                  = { id = "org.jetbrains.kotlin.android",     version.ref = "kotlin" }
kotlin-compose                  = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt                            = { id = "com.google.dagger.hilt.android",   version.ref = "hilt" }
ksp                             = { id = "com.google.devtools.ksp",          version = "2.0.0-1.0.24" }
